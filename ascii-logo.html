<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欧阳雨晴 · 字符旋转动画</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1117;color:#dce4eb;font:14px -apple-system,BlinkMacSystemFont,sans-serif}main{height:100svh;min-height:440px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}header{position:absolute;top:28px;left:32px;right:32px;display:flex;justify-content:space-between;gap:20px;z-index:1;font:12px monospace;letter-spacing:.12em;color:#87939f}footer{position:absolute;bottom:26px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#87939f;font-size:12px}button{border:1px solid #ffffff30;border-radius:24px;background:#ffffff08;color:#e1e7ee;padding:12px 20px;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:4px}@media(max-width:600px){header,footer{left:18px;right:18px}}</style></head>
<body><main><header><span>OUYANG YUQING</span><span>ASCII / 01</span></header><canvas aria-label="欧阳雨晴线条字标的三维字符旋转动画" role="img"></canvas><footer><span>移动鼠标，轻微改变观看角度</span><button type="button" id="pause">暂停动画</button></footer></main><script src="ascii-logo.js"></script></body></html>
